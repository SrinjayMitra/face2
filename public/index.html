    body {
      margin: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
    }

    /* Video section with border */
    #video-section {
      position: relative;
      width: 90%;
      height: 50vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      border: 3px solid #ffcc00;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
      margin-top: 10px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1.05); /* Mirror effect */
      border-radius: 12px;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
    }

    /* Direction text + arrow overlay */
    #direction-text {
      position: absolute;
      top: 8%;
      width: 100%;
      text-align: center;
      font-size: 1.6rem;
      color: #ffcc00;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255, 204, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      z-index: 5;
    }

    /* Arrow animation */
    .arrow {
      display: inline-block;
      font-size: 1.8rem;
      animation: bounce 1s ease-in-out infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    /* Gallery section below video */
    #gallery {
      width: 100%;
      background: #1a1a1a;

      justify-content: center;
      gap: 5px;
      padding-bottom: 6px;

    #gallery-images img {
      width: 65px;

      border-radius: 6px;

      border: 2px solid #ffcc00;

/* Glitch neon text */
.glitch-text {
  font-family: 'Arial Black', sans-serif;
  font-size: 64px;
  color: #0ff;
  position: relative;
  text-transform: uppercase;
  animation: flicker 1.5s infinite;
}

.glitch-text::before,
.glitch-text::after {
  content: attr(data-text);
  position: absolute;
  left: 0;
  top: 0;
  color: #f0f;
  clip: rect(0, 900px, 0, 0);
}

.glitch-text::before {
  animation: glitchTop 2s infinite linear;
}
.glitch-text::after {
  animation: glitchBottom 2s infinite linear;
}

@keyframes flicker {
  0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
  20%, 24%, 55% { opacity: 0.3; }
}

@keyframes glitchTop {
  0% { clip: rect(2px, 9999px, 8px, 0); transform: translate(-2px, -2px); }
  20% { clip: rect(12px, 9999px, 18px, 0); transform: translate(2px, 0); }
  40% { clip: rect(5px, 9999px, 12px, 0); transform: translate(-2px, 1px); }
  60% { clip: rect(15px, 9999px, 22px, 0); transform: translate(1px, -1px); }
  80% { clip: rect(8px, 9999px, 14px, 0); transform: translate(0, 2px); }
  100% { clip: rect(2px, 9999px, 8px, 0); transform: translate(-2px, -2px); }
}

@keyframes glitchBottom {
  0% { clip: rect(20px, 9999px, 28px, 0); transform: translate(2px, 2px); }
  20% { clip: rect(22px, 9999px, 30px, 0); transform: translate(-2px, 0); }
  40% { clip: rect(18px, 9999px, 26px, 0); transform: translate(1px, -1px); }
  60% { clip: rect(25px, 9999px, 32px, 0); transform: translate(0, 1px); }
  80% { clip: rect(20px, 9999px, 28px, 0); transform: translate(-1px, 2px); }
  100% { clip: rect(20px, 9999px, 28px, 0); transform: translate(2px, 2px); }
}

/* Loading dots animation */
.loading-text {
  font-family: monospace;
  font-size: 20px;
  color: #0ff;
  margin-top: 20px;
}
.dots::after {
  content: '';
  display: inline-block;
  width: 5px;
  text-align: left;
  animation: dots 1s steps(4, end) infinite;
}
@keyframes dots {
  0%, 20% { content: ''; }
  40% { content: '.'; }
  60% { content: '..'; }
  80%, 100% { content: '...'; }
}

  <script>
       function logToScreen(level, ...args) {
      const container = document.getElementById("log-container");
      if (!container) return;
      const msg = args.map(a => (typeof a === "object" ? JSON.stringify(a) : a)).join(" ");
      const line = document.createElement("div");
      line.textContent = `[${level.toUpperCase()}] ${msg}`;
      if(level === "error") line.style.color = "red";
      if(level === "warn") line.style.color = "orange";
      container.appendChild(line);
      container.scrollTop = container.scrollHeight;
    }

    ["log", "warn", "error"].forEach(level => {
      const original = console[level];
      console[level] = function(...args) {
        logToScreen(level, ...args);
        original.apply(console, args);
      };
    });

    console.log("Console logging is now visible on screen!");
